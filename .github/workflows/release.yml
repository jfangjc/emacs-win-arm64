name: Release

on:
    workflow_dispatch:
        inputs:
            build_run_id:
                description: Build run ID, or leave blank for the latest successful build
                type: string
                required: false
    workflow_run:
        workflows: [Build]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: emacs-releases
    cancel-in-progress: false

jobs:
    publish:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'schedule')
        runs-on: ubuntu-26.04
        permissions:
            actions: read
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
            - name: Select successful Build run
              id: build
              env:
                  BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
              run: python3 scripts/publish-release.py --build-run "$BUILD_RUN_ID"
            - uses: actions/download-artifact@v7
              if: steps.build.outputs.publish == 'true'
              with:
                  github-token: ${{ github.token }}
                  run-id: ${{ steps.build.outputs.run_id }}
                  pattern: emacs-*-windows-arm64
                  path: artifacts
            - name: Publish verified release
              if: steps.build.outputs.publish == 'true'
              env:
                  RELEASE_COMMIT: ${{ steps.build.outputs.commit }}
              run: python3 scripts/publish-release.py artifacts
